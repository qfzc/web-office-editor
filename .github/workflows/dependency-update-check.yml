name: Dependency update check

on:
  pull_request:
    branches:
      - master
    paths:
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - vite.config.ts
      - tsconfig*.json
      - eslint.config.js
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check
